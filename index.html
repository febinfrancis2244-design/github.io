<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flebin Francis</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 50%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(90vw, 800px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        margin: 0 0 12px;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .badge {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: var(--accent);
        font-weight: bold;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome to my website</h1>
      <p>Hello! This is a simple GitHub Pages site hosted from the <strong>github.io</strong> repository.</p>
      <p>I'm updating the homepage and making sure the site can publish correctly.</p>
      <div class="badge">GitHub Pages Ready</div>
    </div>
  </body>
</html>
